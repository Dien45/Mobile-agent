name: Android Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1️⃣ Siapkan JDK & Gradle
      - name: Siapkan JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 2️⃣ Buat proot-distro binary (bundling)
      - name: Buat proot binary (bundling)
        run: |
          chmod +x ./scripts/bootstrap_proot.sh
          ./scripts/bootstrap_proot.sh   # salin assets/proot, proot-distro ke app/src/main/jniLibs

      # 3️⃣ Buat APK
      - name: Buat APK dengan Gradle
        run: ./gradlew app:assembleDebug --stacktrace

      # 4️⃣ Jalankan tes unit (opsional)
      - name: Jalankan tes unit
        run: ./gradlew app:testDebugUnitTest

      # 5️⃣ Upload artefak build
      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 6️⃣ Release ke GitHub Releases (hanya push ke main)
      - name: Buat Release
        if: github.ref == 'refs/heads/main'
        id: release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          generate_release_notes: true