name: Assemble Arka PRD
on:
  push:
    branches: [main]
    paths: ['.arka-prd/ready']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble final PRD
        shell: bash
        run: |
          cat .arka-prd/part-*.b64 | base64 -d | gzip -d > docs/PRD.md
          rm -rf .arka-prd .github/workflows/assemble-arka-prd.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize Arka product requirements"
          git push
